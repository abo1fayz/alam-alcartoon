<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة التصنيفات — لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .skeleton-cell {
      height: 16px;
      background: linear-gradient(90deg, var(--bg-3) 25%, var(--bg-2) 50%, var(--bg-3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="layout">

    <aside class="sidebar">
      <a class="sidebar__brand" href="index.html">
        <img src="assets/logo.png" alt="شعار">
        <span>لوحة التحكم</span>
      </a>
      <nav class="sidebar__links">
        <a href="index.html">الرئيسية</a>
        <a href="cartoons.html">المحتوى</a>
        <a href="seasons.html">المواسم</a>
        <a href="episodes.html">الحلقات</a>
        <a href="categories.html" class="active">التصنيفات</a>
      </nav>
    </aside>

    <main class="main">
      <div class="page-head">
        <h1 class="page-title">إدارة التصنيفات</h1>
        <button class="btn btn--primary" id="add-btn">+ إضافة تصنيف</button>
      </div>

      <div id="table-area"></div>
    </main>

  </div>

  <!-- ===== نافذة إضافة/تعديل تصنيف ===== -->
  <div class="modal" id="category-modal">
    <div class="modal__box">
      <div class="modal__head">
        <h2 class="modal__title" id="modal-title">إضافة تصنيف</h2>
        <button class="modal__close" data-close>✕</button>
      </div>

      <form class="form" id="category-form">
        <input type="hidden" id="category-id">

        <div class="field">
          <label class="field__label" for="f-name">اسم التصنيف *</label>
          <input class="input" id="f-name" required maxlength="100" placeholder="أكشن">
        </div>

        <div class="field">
          <label class="field__label" for="f-slug">Slug (بالإنجليزية) *</label>
          <input class="input" id="f-slug" dir="ltr" required maxlength="100"
                 placeholder="action">
          <small style="color:var(--text-dim)">
            يُكتب بالإنجليزية وبأحرف صغيرة، بدون مسافات (استخدم الشرطة -)
          </small>
        </div>

        <div class="modal__actions">
          <button class="btn btn--primary" type="submit" id="save-btn">حفظ</button>
          <button class="btn btn--ghost" type="button" data-close>إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=3"></script>
  <script src="js/admin.js?v=v2-direct-media"></script>
  <script src="js/auth.js?v=1"></script>
  <script src="js/categories.js?v=v2-multi-categories"></script>
</body>
</html>
