<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المواسم — لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .skeleton-cell {
      height: 16px;
      background: linear-gradient(90deg, var(--bg-3) 25%, var(--bg-2) 50%, var(--bg-3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="layout">

    <aside class="sidebar">
      <a class="sidebar__brand" href="index.html">
        <img src="assets/logo.png" alt="شعار">
        <span>لوحة التحكم</span>
      </a>
      <nav class="sidebar__links">
        <a href="index.html">الرئيسية</a>
        <a href="cartoons.html">المحتوى</a>
        <a href="seasons.html" class="active">المواسم</a>
        <a href="episodes.html">الحلقات</a>
        <a href="categories.html">التصنيفات</a>
      </nav>
    </aside>

    <main class="main">
      <div class="page-head">
        <h1 class="page-title">إدارة المواسم</h1>
        <button class="btn btn--primary" id="add-btn">+ إضافة موسم</button>
      </div>

      <div class="toolbar">
        <select class="select toolbar__search" id="filter-cartoon">
          <option value="">جميع عناصر المحتوى</option>
        </select>
      </div>

      <div id="table-area"></div>
    </main>

  </div>

  <!-- ===== نافذة إضافة/تعديل موسم ===== -->
  <div class="modal" id="season-modal">
    <div class="modal__box">
      <div class="modal__head">
        <h2 class="modal__title" id="modal-title">إضافة موسم</h2>
        <button class="modal__close" data-close>✕</button>
      </div>

      <form class="form" id="season-form">
        <input type="hidden" id="season-id">

        <div class="field">
          <label class="field__label" for="f-cartoon">المحتوى *</label>
          <select class="select" id="f-cartoon" required></select>
        </div>

        <div class="field">
          <label class="field__label" for="f-number">رقم الموسم *</label>
          <input class="input" id="f-number" type="number" min="1" required placeholder="1">
        </div>

        <div class="field">
          <label class="field__label" for="f-title">اسم الموسم</label>
          <input class="input" id="f-title" maxlength="200" placeholder="الموسم الأول">
        </div>

        <div class="field">
          <label class="field__label" for="f-season-image-file">صورة الموسم الموحدة</label>
          <label class="upload-zone" for="f-season-image-file">
            <input id="f-season-image-file" type="file" accept="image/*">
            <span>اضغط لاختيار صورة الغلاف</span>
          </label>
          <p class="field__hint">تظهر هذه الصورة مع جميع حلقات هذا الموسم، بدلًا من رفع صورة لكل حلقة.</p>
          <input class="input" id="f-season-image-url" type="url" placeholder="أو الصق رابط صورة مباشرًا (اختياري)">
          <img class="preview-img preview-img--season" id="f-season-image-preview" src="" alt="معاينة صورة الموسم" style="display:none">
        </div>

        <div class="modal__actions">
          <button class="btn btn--primary" type="submit" id="save-btn">حفظ</button>
          <button class="btn btn--ghost" type="button" data-close>إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=v2-content-types"></script>
  <script src="js/admin.js?v=v2-direct-media"></script>
  <script src="js/auth.js?v=1"></script>
  <script src="js/seasons.js?v=v3-season-images"></script>
</body>
</html>
