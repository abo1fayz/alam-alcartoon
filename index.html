<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عالم الكرتون — مشاهدة مسلسلات كرتون</title>
  <meta name="description" content="منصة عربية لمشاهدة مسلسلات وأفلام الكرتون">

  <!-- الخط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- الأنماط -->
  <link rel="stylesheet" href="css/style.css?v=compact-featured-hero-1">
  <link rel="stylesheet" href="css/components.css?v=compact-professional-1">
  <link rel="stylesheet" href="css/responsive.css?v=inspired-redesign-1">
</head>
<body>

  <!-- ===== Navbar ===== -->
  <header class="navbar">
    <a class="navbar__brand" href="index.html">
      <img src="assets/images/placeholder-poster.svg" alt="شعار الموقع">
      <span>عالم الكرتون</span>
    </a>

    <nav class="navbar__links" aria-label="التنقل الرئيسي">
      <a href="index.html" class="active">الرئيسية</a>
      <a href="search.html?type=series">المسلسلات</a>
      <a href="search.html?type=movies">الأفلام</a>
      <a href="search.html?type=my-list">قائمتي</a>
    </nav>

    <div class="navbar__actions">
      <a class="btn-icon" href="search.html" aria-label="البحث" title="البحث">🔍</a>
      <button class="btn-icon" id="menu-btn" aria-label="القائمة">☰</button>
    </div>
  </header>

  <!-- قائمة الموبايل -->
  <div class="mobile-menu" id="mobile-menu">
    <div class="mobile-menu__panel">
      <a href="index.html">الرئيسية</a>
      <a href="search.html?type=series">المسلسلات</a>
      <a href="search.html?type=movies">الأفلام</a>
      <a href="search.html?type=my-list">قائمتي</a>
      <a href="search.html">البحث</a>
    </div>
  </div>

  <main class="container home-main">

    <!-- ===== Hero ===== -->
    <section class="hero hero--home" id="hero">
      <div class="spinner" id="hero-spinner"></div>
    </section>

    <nav class="home-content-tabs" aria-label="استكشاف المحتوى">
      <a class="is-active" href="#series-section">الكل</a>
      <a href="#series-section">مسلسلات</a>
      <a href="#movies-section">أفلام</a>
      <a href="#popular-section">الأكثر مشاهدة</a>
      <a href="#categories">التصنيفات</a>
    </nav>

    <!-- ===== أحدث المسلسلات ===== -->
    <section class="section section--home" id="series-section">
      <div class="section__head">
        <h2 class="section__title">أحدث المسلسلات</h2>
        <a class="section__link" href="search.html?type=series">عرض الكل</a>
      </div>
      <div class="grid home-content-row" id="latest-series" aria-label="أحدث المسلسلات"></div>
    </section>

    <!-- ===== أحدث الأفلام ===== -->
    <section class="section section--home" id="movies-section">
      <div class="section__head">
        <h2 class="section__title">أحدث الأفلام</h2>
        <a class="section__link" href="search.html?type=movies">عرض الكل</a>
      </div>
      <div class="grid home-content-row" id="latest-movies" aria-label="أحدث الأفلام"></div>
    </section>

    <!-- ===== الأكثر مشاهدة ===== -->
    <section class="section section--home" id="popular-section">
      <div class="section__head">
        <h2 class="section__title">الأكثر مشاهدة</h2>
        <a class="section__link" href="search.html?type=popular">عرض الكل</a>
      </div>
      <div class="grid home-content-row" id="top-series" aria-label="المحتوى الأكثر مشاهدة"></div>
    </section>

    <!-- ===== التصنيفات ===== -->
    <section class="section section--home" id="categories">
      <div class="section__head">
        <h2 class="section__title">تصنيفات الكرتون</h2>
      </div>
      <div class="cats-grid" id="categories-grid"></div>
    </section>

  </main>

  <footer class="footer">
    عالم الكرتون © <span id="year"></span>
  </footer>

  <!-- مكتبة Supabase الرسمية -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js?v=welcome-contact-2"></script>
  <script src="js/home.js?v=inspired-redesign-1"></script>
</body>
</html>
