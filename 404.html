<!DOCTYPE html>
<html lang="ar" dir="rtl">

  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css?v=inspired-redesign-1">
  <style>
    .err-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      min-height: 60vh;
    }
    .err-page__code {
      font-size: 5rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .err-page__msg { color: var(--text-dim); font-size: 1.05rem; }

<body>

  <header class="navbar">
    <a class="navbar__brand" href="index.html">
      <img src="assets/images/placeholder-poster.svg" alt="شعار الموقع">

    <nav class="navbar__links" aria-label="التنقل الرئيسي">
